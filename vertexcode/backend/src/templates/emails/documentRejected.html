<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
        <tr><td style="background:#4f46e5;padding:20px 28px;">
          <span style="color:#ffffff;font-size:18px;font-weight:700;">VertexWM</span>
        </td></tr>
        <tr><td style="padding:28px;">
          <h2 style="margin:0 0 12px;color:#111827;font-size:18px;">Document Needs Your Attention</h2>
          <p style="margin:0 0 16px;color:#374151;font-size:14px;line-height:1.6;">Hi {{firstName}},</p>
          <p style="margin:0 0 16px;color:#374151;font-size:14px;line-height:1.6;">
            Your <strong>{{documentType}}</strong> has been reviewed and was <strong style="color:#dc2626;">rejected</strong>. Please re-upload a corrected copy.
          </p>
          <table role="presentation" width="100%" style="background:#fef2f2;border-radius:8px;margin:0 0 16px;">
            <tr><td style="padding:14px 16px;color:#991b1b;font-size:13px;line-height:1.6;">
              <strong>Reason:</strong> {{remarks}}
            </td></tr>
          </table>
          <a href="{{appUrl}}/documents" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;">Re-upload Document</a>
        </td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #e5e7eb;">
          <p style="margin:0;color:#9ca3af;font-size:12px;">This is an automated message from VertexWM. Please do not reply.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
